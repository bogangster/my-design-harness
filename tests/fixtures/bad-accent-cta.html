<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fixture: bad-accent-cta.html</title>
<style>
:root{--color-ink:#141414;--color-canvas:#ffffff;--color-canvas-soft:#f3f3f3;--color-field:#f0f0f0;--color-accent:#0066ff;--radius-sm:16px;--radius-md:24px;--radius-full:9999px;--space-md:16px}
body{margin:0;background:var(--color-canvas);color:var(--color-ink);font-family:"Pretendard Variable",-apple-system,sans-serif;font-size:15px;font-weight:400;line-height:1.5;letter-spacing:0}
.screen{padding:0 16px}
section{padding:24px 0}
h1{font-size:28px;font-weight:700;line-height:1.3}
.card{background:var(--color-canvas);border:1px solid #f0f0f0;border-radius:var(--radius-md);padding:24px}
[data-component="button-primary"]{background:var(--color-accent);color:#ffffff;border:0;border-radius:var(--radius-full);padding:0 16px;height:48px;font-size:15px;font-weight:600}
[data-component="badge-popular"]{background:var(--color-accent);color:#ffffff;border-radius:var(--radius-full);padding:4px 8px;font-size:12px;font-weight:600}
[data-component="text-input"]{background:var(--color-field);border:0;border-radius:var(--radius-sm);padding:12px 16px}
</style>
</head>
<body>
<main class="screen">
<section data-ref="R1" data-component="page-header"><h1>내 자산</h1></section>
<section data-ref="R2" data-component="asset-card" class="card">
  <h3 data-field="Asset.title">QA 자동화 스킬</h3>
  <span data-field="Asset.review_status">검수 대기</span>
  <span data-component="badge-popular">추천</span>
</section>
<section data-ref="R3" data-component="asset-form">
  <label for="vis">공개 범위</label>
  <select id="vis" data-component="select" data-field="Asset.visibility">
    <option value="private" selected>비공개</option>
    <option value="member_only">멤버 공개</option>
    <option value="sale_requested" data-role-only="seller">판매 신청</option>
  </select>
  <input data-component="text-input" placeholder="자산 이름">
</section>
<section data-ref="R4" data-component="cta"><button data-component="button-primary">저장</button></section>
<section data-ref="own" data-component="footer-note"><p>멤버가 만든 자료는 기본 비공개예요.</p></section>
</main>
</body>
</html>
